name: Coleta semanal de dados

on:
  schedule:
    # Sexta 10:07 UTC (07:07 em Brasília), antes do check-in de 08:41.
    - cron: '7 10 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-semana
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Coletar dados
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gsa.json"
          export GOOGLE_SERVICE_ACCOUNT_KEY_FILE="$RUNNER_TEMP/gsa.json"
          node scripts/dados-semana.mjs
          rm -f "$RUNNER_TEMP/gsa.json"

      - name: Commitar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorios/dados
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
            exit 0
          fi
          git commit -m "Coleta semanal de dados ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
